# docker-compose.yml
services:
  resin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RESIN_VERSION: ${RESIN_VERSION:-}
    image: ghcr.io/resinat/resin:latest
    container_name: resin
    restart: unless-stopped
    environment:
      RESIN_ADMIN_TOKEN: ${RESIN_ADMIN_TOKEN:-change-me-admin-token} # 修改为你的管理后台密码
      RESIN_PROXY_TOKEN: ${RESIN_PROXY_TOKEN:-change-me-proxy-token} # 修改为你的代理密码
      RESIN_LISTEN_ADDRESS: 0.0.0.0
      RESIN_PORT: ${RESIN_PORT:-2260}
    ports:
      - ${RESIN_PORT:-2260}:2260
    volumes:
      - ./data/cache:/var/cache/resin
      - ./data/state:/var/lib/resin
      - ./data/log:/var/log/resin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2260/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s